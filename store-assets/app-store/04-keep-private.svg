<svg width="1290" height="2796" viewBox="0 0 1290 2796" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Sakina App Store screenshot 4 — keep your reflections completely private</title>
<desc>Dark navy celestial background with a bold KEEP headline above an iPhone mockup bleeding off the bottom edge, showing a journal list and a note that reflections stay on-device only.</desc>
