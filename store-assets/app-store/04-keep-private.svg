<g clip-path="url(#deviceScreenClip4)">
  <g transform="translate(-68.775,102.0) scale(1.3218)">
    <text x="200" y="520" font-family="Arial, sans-serif" font-size="22" fill="#F5EDE3" fill-opacity="0.7">9:41</text>
    <rect x="860" y="500" width="28" height="14" rx="3" fill="none" stroke="#F5EDE3" stroke-opacity="0.6" stroke-width="1.5"/>

    <text x="200" y="600" font-family="Georgia, serif" font-size="18" letter-spacing="3" fill="#D4AF37" fill-opacity="0.75">PRIVATE</text>
    <text x="200" y="650" font-family="Georgia, serif" font-size="40" font-weight="bold" fill="#F5EDE3">My Journal</text>

    <g>
      <rect x="200" y="700" width="656" height="180" rx="24" fill="#F5EDE3" fill-opacity="0.04" stroke="#F5EDE3" stroke-opacity="0.08" stroke-width="1.5"/>
      <circle cx="240" cy="740" r="8" fill="#34D399"/>
      <text x="265" y="747" font-family="Arial, sans-serif" font-size="20" fill="#F5EDE3" fill-opacity="0.5">Today · Calm</text>
      <text x="240" y="800" font-family="Georgia, serif" font-size="26" fill="#F5EDE3" fill-opacity="0.85">"I felt at ease after Maghrib —</text>
      <text x="240" y="835" font-family="Georgia, serif" font-size="26" fill="#F5EDE3" fill-opacity="0.85">grateful for a quiet evening."</text>
    </g>
    <g>
      <rect x="200" y="900" width="656" height="180" rx="24" fill="#F5EDE3" fill-opacity="0.04" stroke="#F5EDE3" stroke-opacity="0.08" stroke-width="1.5"/>
      <circle cx="240" cy="940" r="8" fill="#818CF8"/>
      <text x="265" y="947" font-family="Arial, sans-serif" font-size="20" fill="#F5EDE3" fill-opacity="0.5">Yesterday · Overwhelmed</text>
      <text x="240" y="1000" font-family="Georgia, serif" font-size="26" fill="#F5EDE3" fill-opacity="0.85">"Reminded that Allah does not</text>
      <text x="240" y="1035" font-family="Georgia, serif" font-size="26" fill="#F5EDE3" fill-opacity="0.85">burden a soul beyond its capacity."</text>
    </g>
    <g>
      <rect x="200" y="1100" width="656" height="130" rx="24" fill="#F5EDE3" fill-opacity="0.04" stroke="#F5EDE3" stroke-opacity="0.08" stroke-width="1.5"/>
      <circle cx="240" cy="1140" r="8" fill="#FBBF24"/>
      <text x="265" y="1147" font-family="Arial, sans-serif" font-size="20" fill="#F5EDE3" fill-opacity="0.5">2 days ago · Grateful</text>
      <text x="240" y="1200" font-family="Georgia, serif" font-size="26" fill="#F5EDE3" fill-opacity="0.85">"Thankful for my family's health."</text>
    </g>

    <!-- privacy chip -->
    <rect x="200" y="1290" width="656" height="220" rx="24" fill="#6B8EAE" fill-opacity="0.07" stroke="#6B8EAE" stroke-opacity="0.2" stroke-width="1.5"/>
    <g transform="translate(240,1345)">
      <rect x="0" y="10" width="30" height="24" rx="4" fill="none" stroke="#F5EDE3" stroke-opacity="0.7" stroke-width="2.5"/>
      <path d="M6,10 L6,0 a9,9 0 0 1 18,0 L24,10" fill="none" stroke="#F5EDE3" stroke-opacity="0.7" stroke-width="2.5"/>
    </g>
    <text x="292" y="1365" font-family="Georgia, serif" font-size="26" font-weight="bold" fill="#F5EDE3" fill-opacity="0.9">On this device only</text>
    <text x="240" y="1415" font-family="Arial, sans-serif" font-size="24" fill="#F5EDE3" fill-opacity="0.65">
      <tspan x="240" dy="0">Saved on this device only —</tspan>
      <tspan x="240" dy="36">we never collect or store them.</tspan>
    </text>

    <!-- bottom tab bar (Journal active) -->
    <rect x="240" y="1650" width="600" height="90" rx="45" fill="#F5EDE3" fill-opacity="0.05" stroke="#D4AF37" stroke-opacity="0.15" stroke-width="1.5"/>
    <g stroke="#F5EDE3" stroke-opacity="0.35" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
