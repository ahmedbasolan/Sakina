<svg width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Sakina Play Store background 1</title>
<desc>Celestial Night background only — navy gradient, faint gold mandala, twinkling stars.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#07111E"/>
    <stop offset="0.55" stop-color="#0C1A2E"/>
    <stop offset="1" stop-color="#0F1F30"/>
  </linearGradient>
</defs>

<rect x="0" y="0" width="1080" height="1920" fill="url(#bg)"/>

<!-- faint mandala watermark -->
<g stroke="#D4AF37" stroke-opacity="0.10" fill="none" stroke-width="2">
  <circle cx="540" cy="300" r="230"/>
  <circle cx="540" cy="300" r="170"/>
  <g transform="translate(540,300)">
    <ellipse cx="0" cy="0" rx="230" ry="46" transform="rotate(0)"/>
    <ellipse cx="0" cy="0" rx="230" ry="46" transform="rotate(30)"/>
    <ellipse cx="0" cy="0" rx="230" ry="46" transform="rotate(60)"/>
    <ellipse cx="0" cy="0" rx="230" ry="46" transform="rotate(90)"/>
    <ellipse cx="0" cy="0" rx="230" ry="46" transform="rotate(120)"/>
    <ellipse cx="0" cy="0" rx="230" ry="46" transform="rotate(150)"/>
  </g>
</g>

<!-- twinkling stars -->
<g fill="#D4AF37">
  <circle cx="120" cy="90" r="4" fill-opacity="0.8"/>
  <circle cx="960" cy="130" r="3" fill-opacity="0.6"/>
  <circle cx="220" cy="210" r="3.5" fill-opacity="0.7"/>
  <circle cx="860" cy="60" r="3" fill-opacity="0.55"/>
  <circle cx="500" cy="50" r="3" fill-opacity="0.6"/>
  <circle cx="70" cy="330" r="3" fill-opacity="0.5"/>
  <circle cx="1000" cy="340" r="3.5" fill-opacity="0.6"/>
  <circle cx="150" cy="620" r="3" fill-opacity="0.45"/>
  <circle cx="930" cy="720" r="3.5" fill-opacity="0.5"/>
  <circle cx="80" cy="1050" r="3" fill-opacity="0.45"/>
  <circle cx="1010" cy="1180" r="3" fill-opacity="0.5"/>
  <circle cx="180" cy="1450" r="3.5" fill-opacity="0.5"/>
  <circle cx="900" cy="1560" r="3" fill-opacity="0.45"/>
  <circle cx="520" cy="1780" r="3" fill-opacity="0.4"/>
  <circle cx="320" cy="1680" r="2.5" fill-opacity="0.4"/>
</g>
</svg>
