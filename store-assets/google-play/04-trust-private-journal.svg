<svg width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Sakina Play Store screenshot 4 — private journal</title>
<desc>Dark navy celestial background with a headline about privacy above a phone mockup showing a journal list and a note that reflections stay on-device only.</desc>
<defs>
  <linearGradient id="bgGrad4" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#07111E"/>
    <stop offset="0.55" stop-color="#0C1A2E"/>
    <stop offset="1" stop-color="#0F1F30"/>
  </linearGradient>
  <linearGradient id="screenGlow4" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#D4AF37" stop-opacity="0.10"/>
    <stop offset="1" stop-color="#D4AF37" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="screenClip4"><rect x="164" y="466" width="752" height="1310" rx="46"/></clipPath>
</defs>

<rect x="0" y="0" width="1080" height="1920" fill="url(#bgGrad4)"/>

<g stroke="#D4AF37" stroke-opacity="0.10" fill="none" stroke-width="2">
  <circle cx="540" cy="300" r="230"/>
  <circle cx="540" cy="300" r="170"/>
  <g transform="translate(540,300)">
    <ellipse cx="0" cy="0" rx="230" ry="46" transform="rotate(0)"/>
    <ellipse cx="0" cy="0" rx="230" ry="46" transform="rotate(30)"/>
    <ellipse cx="0" cy="0" rx="230" ry="46" transform="rotate(60)"/>
    <ellipse cx="0" cy="0" rx="230" ry="46" transform="rotate(90)"/>
    <ellipse cx="0" cy="0" rx="230" ry="46" transform="rotate(120)"/>
    <ellipse cx="0" cy="0" rx="230" ry="46" transform="rotate(150)"/>
  </g>
</g>

<g fill="#D4AF37">
  <circle cx="125" cy="90" r="4" fill-opacity="0.8"/>
  <circle cx="955" cy="130" r="3" fill-opacity="0.6"/>
  <circle cx="225" cy="210" r="3.5" fill-opacity="0.7"/>
  <circle cx="855" cy="60" r="3" fill-opacity="0.55"/>
  <circle cx="495" cy="50" r="3" fill-opacity="0.6"/>
  <circle cx="1005" cy="335" r="3.5" fill-opacity="0.6"/>
</g>

<!-- badge -->
<rect x="90" y="150" width="470" height="66" rx="33" fill="none" stroke="#D4AF37" stroke-opacity="0.6" stroke-width="2"/>
<text x="325" y="192" text-anchor="middle" font-family="Georgia, serif" font-size="24" letter-spacing="1.5" fill="#D4AF37" font-weight="bold">YOUR HEART, KEPT PRIVATE</text>

<!-- headline -->
<text x="90" y="300" font-family="Georgia, serif" font-size="62" font-weight="bold" fill="#F5EDE3">Your reflections</text>
<text x="90" y="378" font-family="Georgia, serif" font-size="62" font-weight="bold" fill="#F5EDE3">never leave your phone</text>

<!-- phone mockup -->
<rect x="140" y="446" width="800" height="1340" rx="64" fill="#0C1A2E" stroke="#D4AF37" stroke-opacity="0.35" stroke-width="3"/>
<rect x="164" y="466" width="752" height="1310" rx="46" fill="#07111E"/>
<rect x="164" y="466" width="752" height="1310" rx="46" fill="url(#screenGlow4)"/>

<g clip-path="url(#screenClip4)">
  <text x="200" y="520" font-family="Arial, sans-serif" font-size="22" fill="#F5EDE3" fill-opacity="0.7">9:41</text>
  <rect x="860" y="500" width="28" height="14" rx="3" fill="none" stroke="#F5EDE3" stroke-opacity="0.6" stroke-width="1.5"/>

  <text x="200" y="600" font-family="Georgia, serif" font-size="18" letter-spacing="3" fill="#D4AF37" fill-opacity="0.75">PRIVATE</text>
  <text x="200" y="650" font-family="Georgia, serif" font-size="40" font-weight="bold" fill="#F5EDE3">My Journal</text>

  <!-- journal entries -->
  <g>
    <rect x="200" y="700" width="656" height="180" rx="24" fill="#F5EDE3" fill-opacity="0.04" stroke="#F5EDE3" stroke-opacity="0.08" stroke-width="1.5"/>
    <circle cx="240" cy="740" r="8" fill="#34D399"/>
    <text x="265" y="747" font-family="Arial, sans-serif" font-size="20" fill="#F5EDE3" fill-opacity="0.5">Today · Calm</text>
    <text x="240" y="800" font-family="Georgia, serif" font-size="26" fill="#F5EDE3" fill-opacity="0.85">"I felt at ease after Maghrib —</text>
    <text x="240" y="835" font-family="Georgia, serif" font-size="26" fill="#F5EDE3" fill-opacity="0.85">grateful for a quiet evening."</text>
  </g>
  <g>
    <rect x="200" y="900" width="656" height="180" rx="24" fill="#F5EDE3" fill-opacity="0.04" stroke="#F5EDE3" stroke-opacity="0.08" stroke-width="1.5"/>
    <circle cx="240" cy="940" r="8" fill="#818CF8"/>
    <text x="265" y="947" font-family="Arial, sans-serif" font-size="20" fill="#F5EDE3" fill-opacity="0.5">Yesterday · Overwhelmed</text>
    <text x="240" y="1000" font-family="Georgia, serif" font-size="26" fill="#F5EDE3" fill-opacity="0.85">"Reminded that Allah does not</text>
    <text x="240" y="1035" font-family="Georgia, serif" font-size="26" fill="#F5EDE3" fill-opacity="0.85">burden a soul beyond its capacity."</text>
  </g>
  <g>
    <rect x="200" y="1100" width="656" height="130" rx="24" fill="#F5EDE3" fill-opacity="0.04" stroke="#F5EDE3" stroke-opacity="0.08" stroke-width="1.5"/>
    <circle cx="240" cy="1140" r="8" fill="#FBBF24"/>
    <text x="265" y="1147" font-family="Arial, sans-serif" font-size="20" fill="#F5EDE3" fill-opacity="0.5">2 days ago · Grateful</text>
    <text x="240" y="1200" font-family="Georgia, serif" font-size="26" fill="#F5EDE3" fill-opacity="0.85">"Thankful for my family's health."</text>
  </g>

  <!-- privacy chip -->
  <rect x="200" y="1290" width="656" height="220" rx="24" fill="#6B8EAE" fill-opacity="0.07" stroke="#6B8EAE" stroke-opacity="0.2" stroke-width="1.5"/>
  <g transform="translate(240,1345)">
    <rect x="0" y="10" width="30" height="24" rx="4" fill="none" stroke="#F5EDE3" stroke-opacity="0.7" stroke-width="2.5"/>
    <path d="M6,10 L6,0 a9,9 0 0 1 18,0 L24,10" fill="none" stroke="#F5EDE3" stroke-opacity="0.7" stroke-width="2.5"/>
  </g>
  <text x="292" y="1365" font-family="Georgia, serif" font-size="26" font-weight="bold" fill="#F5EDE3" fill-opacity="0.9">On this device only</text>
  <text x="240" y="1415" font-family="Arial, sans-serif" font-size="24" fill="#F5EDE3" fill-opacity="0.65">
    <tspan x="240" dy="0">Saved on this device only —</tspan>
    <tspan x="240" dy="36">we never collect or store them.</tspan>
  </text>

  <!-- bottom tab bar (Journal active) -->
  <rect x="240" y="1650" width="600" height="90" rx="45" fill="#F5EDE3" fill-opacity="0.05" stroke="#D4AF37" stroke-opacity="0.15" stroke-width="1.5"/>
  <g stroke="#F5EDE3" stroke-opacity="0.35" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M288,1683 L300,1673 L312,1683 L312,1702 L288,1702 Z"/>
    <circle cx="420" cy="1695" r="13"/>
    <path d="M414,1701 L426,1689"/>
    <path d="M540,1683 C543,1689 546,1691 543,1695 C546,1694 547,1698 543,1699 C537,1701 533,1695 535,1690 C537,1687 540,1683 540,1683 Z" fill="#F5EDE3" fill-opacity="0.35" stroke="none"/>
  </g>
  <g stroke="#D4AF37" stroke-width="2.5" fill="none">
    <line x1="648" y1="1687" x2="672" y2="1687"/>
    <line x1="648" y1="1695" x2="672" y2="1695"/>
    <line x1="648" y1="1703" x2="672" y2="1703"/>
  </g>
  <g stroke="#F5EDE3" stroke-opacity="0.35" stroke-width="2" fill="none">
    <rect x="768" y="1683" width="24" height="24" rx="3"/>
    <line x1="780" y1="1683" x2="780" y2="1707"/>
  </g>
</g>
</svg>
