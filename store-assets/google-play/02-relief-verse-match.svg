<svg width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Sakina Play Store screenshot 2 — verse matched to mood</title>
<desc>Dark navy celestial background with a headline about relief above a phone mockup showing a Quran verse matched to the Overwhelmed mood.</desc>
<defs>
  <linearGradient id="bgGrad2" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#07111E"/>
    <stop offset="0.55" stop-color="#0C1A2E"/>
    <stop offset="1" stop-color="#0F1F30"/>
  </linearGradient>
  <linearGradient id="screenGlow2" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#D4AF37" stop-opacity="0.10"/>
    <stop offset="1" stop-color="#D4AF37" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="screenClip2"><rect x="164" y="466" width="752" height="1310" rx="46"/></clipPath>
</defs>

<rect x="0" y="0" width="1080" height="1920" fill="url(#bgGrad2)"/>

<g stroke="#D4AF37" stroke-opacity="0.10" fill="none" stroke-width="2">
  <circle cx="540" cy="300" r="230"/>
  <circle cx="540" cy="300" r="170"/>
  <g transform="translate(540,300)">
    <ellipse cx="0" cy="0" rx="230" ry="46" transform="rotate(0)"/>
    <ellipse cx="0" cy="0" rx="230" ry="46" transform="rotate(30)"/>
    <ellipse cx="0" cy="0" rx="230" ry="46" transform="rotate(60)"/>
    <ellipse cx="0" cy="0" rx="230" ry="46" transform="rotate(90)"/>
    <ellipse cx="0" cy="0" rx="230" ry="46" transform="rotate(120)"/>
    <ellipse cx="0" cy="0" rx="230" ry="46" transform="rotate(150)"/>
  </g>
</g>

<g fill="#D4AF37">
  <circle cx="130" cy="90" r="4" fill-opacity="0.8"/>
  <circle cx="950" cy="130" r="3" fill-opacity="0.6"/>
  <circle cx="230" cy="210" r="3.5" fill-opacity="0.7"/>
  <circle cx="850" cy="60" r="3" fill-opacity="0.55"/>
  <circle cx="490" cy="50" r="3" fill-opacity="0.6"/>
  <circle cx="1000" cy="340" r="3.5" fill-opacity="0.6"/>
</g>

<!-- badge -->
<rect x="90" y="150" width="470" height="66" rx="33" fill="none" stroke="#D4AF37" stroke-opacity="0.6" stroke-width="2"/>
<text x="325" y="192" text-anchor="middle" font-family="Georgia, serif" font-size="24" letter-spacing="1.5" fill="#D4AF37" font-weight="bold">MEET YOU WHERE YOU ARE</text>

<!-- headline -->
<text x="90" y="300" font-family="Georgia, serif" font-size="62" font-weight="bold" fill="#F5EDE3">Overwhelmed? Anxious?</text>
<text x="90" y="378" font-family="Georgia, serif" font-size="62" font-weight="bold" fill="#F5EDE3">There's a verse for that.</text>

<!-- phone mockup -->
<rect x="140" y="446" width="800" height="1340" rx="64" fill="#0C1A2E" stroke="#D4AF37" stroke-opacity="0.35" stroke-width="3"/>
<rect x="164" y="466" width="752" height="1310" rx="46" fill="#07111E"/>
<rect x="164" y="466" width="752" height="1310" rx="46" fill="url(#screenGlow2)"/>

<g clip-path="url(#screenClip2)">
  <text x="200" y="520" font-family="Arial, sans-serif" font-size="22" fill="#F5EDE3" fill-opacity="0.7">9:41</text>
  <rect x="860" y="500" width="28" height="14" rx="3" fill="none" stroke="#F5EDE3" stroke-opacity="0.6" stroke-width="1.5"/>

  <!-- mood tag pill -->
  <rect x="200" y="610" width="220" height="56" rx="28" fill="#818CF8" fill-opacity="0.16" stroke="#818CF8" stroke-opacity="0.45" stroke-width="1.5"/>
  <circle cx="230" cy="638" r="7" fill="#818CF8"/>
  <text x="252" y="646" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#818CF8">Overwhelmed</text>

  <!-- reference row -->
  <text x="540" y="770" text-anchor="middle" font-family="Georgia, serif" font-size="20" letter-spacing="2" fill="#D4AF37" fill-opacity="0.8">SURAH AL-BAQARAH · 2:286</text>

  <!-- arabic verse -->
  <text x="540" y="880" text-anchor="middle" font-family="Times New Roman, serif" font-size="46" fill="#EDD9A3" direction="rtl">لَا يُكَلِّفُ اللَّهُ نَفْسًا إِلَّا وُسْعَهَا</text>

  <!-- divider -->
  <line x1="440" y1="960" x2="640" y2="960" stroke="#F5EDE3" stroke-opacity="0.15" stroke-width="1.5"/>
  <circle cx="540" cy="960" r="5" fill="#D4AF37" fill-opacity="0.6"/>

  <!-- translation -->
  <text x="540" y="1050" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="32" fill="#F5EDE3" fill-opacity="0.85">
    <tspan x="540" dy="0">"Allah does not burden a</tspan>
    <tspan x="540" dy="46">soul beyond what it can bear."</tspan>
  </text>

  <!-- reflection chip -->
  <rect x="200" y="1200" width="656" height="140" rx="24" fill="#F5EDE3" fill-opacity="0.04" stroke="#D4AF37" stroke-opacity="0.15" stroke-width="1.5"/>
  <text x="230" y="1250" font-family="Arial, sans-serif" font-size="18" letter-spacing="2" fill="#D4AF37" fill-opacity="0.8">REFLECTION</text>
  <text x="230" y="1295" font-family="Georgia, serif" font-size="24" fill="#F5EDE3" fill-opacity="0.75">Whatever feels too heavy right now</text>
  <text x="230" y="1325" font-family="Georgia, serif" font-size="24" fill="#F5EDE3" fill-opacity="0.75">was never meant for you to carry alone.</text>

  <!-- bottom tab bar (Home active) -->
  <rect x="240" y="1650" width="600" height="90" rx="45" fill="#F5EDE3" fill-opacity="0.05" stroke="#D4AF37" stroke-opacity="0.15" stroke-width="1.5"/>
  <g stroke="#D4AF37" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M288,1683 L300,1673 L312,1683 L312,1702 L288,1702 Z"/>
  </g>
  <g stroke="#F5EDE3" stroke-opacity="0.35" stroke-width="2" fill="none">
    <circle cx="420" cy="1695" r="13"/>
    <path d="M414,1701 L426,1689"/>
    <path d="M540,1683 C543,1689 546,1691 543,1695 C546,1694 547,1698 543,1699 C537,1701 533,1695 535,1690 C537,1687 540,1683 540,1683 Z" fill="#F5EDE3" fill-opacity="0.35" stroke="none"/>
    <line x1="648" y1="1687" x2="672" y2="1687"/>
    <line x1="648" y1="1695" x2="672" y2="1695"/>
    <line x1="648" y1="1703" x2="672" y2="1703"/>
    <rect x="768" y="1683" width="24" height="24" rx="3"/>
    <line x1="780" y1="1683" x2="780" y2="1707"/>
  </g>
</g>
</svg>
