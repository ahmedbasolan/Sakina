  <g stroke="#D4AF37" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M288,1683 L300,1673 L312,1683 L312,1702 L288,1702 Z"/>
  </g>
  <g stroke="#F5EDE3" stroke-opacity="0.35" stroke-width="2" fill="none">
    <circle cx="420" cy="1695" r="13"/>
    <path d="M414,1701 L426,1689" stroke-opacity="0.35"/>
    <path d="M540,1683 C543,1689 546,1691 543,1695 C546,1694 547,1698 543,1699 C537,1701 533,1695 535,1690 C537,1687 540,1683 540,1683 Z" fill="#F5EDE3" fill-opacity="0.35" stroke="none"/>
    <line x1="648" y1="1687" x2="672" y2="1687"/>
    <line x1="648" y1="1695" x2="672" y2="1695"/>
    <line x1="648" y1="1703" x2="672" y2="1703"/>
    <rect x="768" y="1683" width="24" height="24" rx="3"/>
    <line x1="780" y1="1683" x2="780" y2="1707"/>
  </g>
