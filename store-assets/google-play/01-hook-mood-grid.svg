  <g>
    <rect x="440" y="940" width="220" height="220" rx="28" fill="#C084FC" fill-opacity="0.16" stroke="#C084FC" stroke-opacity="0.4" stroke-width="1.5"/>
    <circle cx="550" cy="1010" r="24" fill="#C084FC" fill-opacity="0.25"/>
    <text x="550" y="1120" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#C084FC">Lonely</text>
