<svg width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Sakina Play Store screenshot 1 — mood grid hook</title>
<desc>Dark navy celestial background with a headline "Tap your mood. Meet a verse for it." above a phone mockup showing a 3x3 grid of mood tiles.</desc>
<defs>
  <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#07111E"/>
    <stop offset="0.55" stop-color="#0C1A2E"/>
    <stop offset="1" stop-color="#0F1F30"/>
  </linearGradient>
  <linearGradient id="screenGlow" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#D4AF37" stop-opacity="0.10"/>
    <stop offset="1" stop-color="#D4AF37" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="screenClip"><rect x="164" y="466" width="752" height="1310" rx="46"/></clipPath>
</defs>

<rect x="0" y="0" width="1080" height="1920" fill="url(#bgGrad)"/>

<!-- faint mandala watermark (real AnimatedMandala lattice) -->
<g transform="translate(300,60) scale(4.8)" opacity="0.16" fill="none" stroke="#D4AF37" stroke-linejoin="round" stroke-linecap="round"><circle cx="50" cy="50" r="48" stroke-width="0.5" opacity="0.6"/><path d="M 50.00,2.00 L 98.00,50.00 M 74.00,8.43 L 91.57,74.00 M 91.57,26.00 L 74.00,91.57 M 98.00,50.00 L 50.00,98.00 M 91.57,74.00 L 26.00,91.57 M 74.00,91.57 L 8.43,74.00 M 50.00,98.00 L 2.00,50.00 M 26.00,91.57 L 8.43,26.00 M 8.43,74.00 L 26.00,8.43 M 2.00,50.00 L 50.00,2.00 M 8.43,26.00 L 74.00,8.43 M 26.00,8.43 L 91.57,26.00" stroke-width="0.27" opacity="0.1"/><path d="M 50.00,2.00 L 91.57,74.00 M 74.00,8.43 L 74.00,91.57 M 91.57,26.00 L 50.00,98.00 M 98.00,50.00 L 26.00,91.57 M 91.57,74.00 L 8.43,74.00 M 74.00,91.57 L 2.00,50.00 M 50.00,98.00 L 8.43,26.00 M 26.00,91.57 L 26.00,8.43 M 8.43,74.00 L 50.00,2.00 M 2.00,50.00 L 74.00,8.43 M 8.43,26.00 L 91.57,26.00 M 26.00,8.43 L 98.00,50.00" stroke-width="0.27" opacity="0.1"/><path d="M 50.00,2.00 L 74.00,91.57 M 74.00,8.43 L 50.00,98.00 M 91.57,26.00 L 26.00,91.57 M 98.00,50.00 L 8.43,74.00 M 91.57,74.00 L 2.00,50.00 M 74.00,91.57 L 8.43,26.00 M 50.00,98.00 L 26.00,8.43 M 26.00,91.57 L 50.00,2.00 M 8.43,74.00 L 74.00,8.43 M 2.00,50.00 L 91.57,26.00 M 8.43,26.00 L 98.00,50.00 M 26.00,8.43 L 91.57,74.00" stroke-width="0.27" opacity="0.15"/><circle cx="50" cy="50" r="24" stroke-width="0.24" opacity="0.3"/><circle cx="50" cy="50" r="8.64" stroke-width="0.5" opacity="0.6"/></g>

<!-- twinkling stars -->
<g fill="#D4AF37">
  <circle cx="120" cy="90" r="4" fill-opacity="0.8"/>
  <circle cx="960" cy="130" r="3" fill-opacity="0.6"/>
  <circle cx="220" cy="210" r="3.5" fill-opacity="0.7"/>
  <circle cx="860" cy="60" r="3" fill-opacity="0.55"/>
  <circle cx="500" cy="50" r="3" fill-opacity="0.6"/>
  <circle cx="70" cy="330" r="3" fill-opacity="0.5"/>
  <circle cx="1000" cy="340" r="3.5" fill-opacity="0.6"/>
</g>

<!-- badge -->
<rect x="90" y="150" width="470" height="66" rx="33" fill="none" stroke="#D4AF37" stroke-opacity="0.6" stroke-width="2"/>
<text x="325" y="192" text-anchor="middle" font-family="Georgia, serif" font-size="24" letter-spacing="1.5" fill="#D4AF37" font-weight="bold">A VERSE FOR HOW YOU FEEL</text>

<!-- headline -->
<text x="90" y="300" font-family="Georgia, serif" font-size="66" font-weight="bold" fill="#F5EDE3">Tap your mood.</text>
<text x="90" y="378" font-family="Georgia, serif" font-size="66" font-weight="bold" fill="#F5EDE3">Meet a verse for it.</text>

<!-- phone mockup -->
<rect x="140" y="446" width="800" height="1340" rx="64" fill="#0C1A2E" stroke="#D4AF37" stroke-opacity="0.35" stroke-width="3"/>
<rect x="164" y="466" width="752" height="1310" rx="46" fill="#07111E"/>
<rect x="164" y="466" width="752" height="1310" rx="46" fill="url(#screenGlow)"/>

<g clip-path="url(#screenClip)">
