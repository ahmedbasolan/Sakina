    <circle cx="310" cy="770" r="24" fill="#818CF8" fill-opacity="0.25"/>
    <text x="310" y="880" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#818CF8">Overwhelmed</text>
  </g>
  <g>
    <rect x="440" y="700" width="220" height="220" rx="28" fill="#94A3B8" fill-opacity="0.16" stroke="#94A3B8" stroke-opacity="0.4" stroke-width="1.5"/>
    <circle cx="550" cy="770" r="24" fill="#94A3B8" fill-opacity="0.25"/>
    <text x="550" y="880" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#94A3B8">Sad</text>
