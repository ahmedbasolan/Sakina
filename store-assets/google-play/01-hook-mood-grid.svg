    <rect x="200" y="1180" width="220" height="220" rx="28" fill="#22D3EE" fill-opacity="0.16" stroke="#22D3EE" stroke-opacity="0.4" stroke-width="1.5"/>
    <circle cx="310" cy="1250" r="24" fill="#22D3EE" fill-opacity="0.25"/>
    <text x="310" y="1360" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#22D3EE">Hopeful</text>
  </g>
  <g>
    <rect x="440" y="1180" width="220" height="220" rx="28" fill="#A3A3A3" fill-opacity="0.14" stroke="#A3A3A3" stroke-opacity="0.35" stroke-width="1.5"/>
    <circle cx="550" cy="1250" r="24" fill="#A3A3A3" fill-opacity="0.22"/>
    <text x="550" y="1360" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#A3A3A3">Guilty</text>
  </g>
  <g>
    <rect x="680" y="1180" width="220" height="220" rx="28" fill="#34D399" fill-opacity="0.18" stroke="#34D399" stroke-opacity="0.45" stroke-width="1.5"/>
    <circle cx="790" cy="1250" r="24" fill="#34D399" fill-opacity="0.28"/>
    <text x="790" y="1360" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#34D399">Calm</text>
  </g>

