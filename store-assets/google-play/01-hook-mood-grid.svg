    <rect x="680" y="940" width="220" height="220" rx="28" fill="#FBBF24" fill-opacity="0.16" stroke="#FBBF24" stroke-opacity="0.4" stroke-width="1.5"/>
    <circle cx="790" cy="1010" r="24" fill="#FBBF24" fill-opacity="0.25"/>
    <text x="790" y="1120" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#FBBF24">Grateful</text>
  </g>

  <!-- row 3 -->
