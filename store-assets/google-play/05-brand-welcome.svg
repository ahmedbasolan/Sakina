<svg width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Sakina Play Store screenshot 5 — brand welcome</title>
<desc>Dark navy celestial background with the Sakina tagline above a phone mockup of the onboarding welcome screen, closing with an honest no-signup footer line.</desc>
<defs>
  <linearGradient id="bgGrad5" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#07111E"/>
    <stop offset="0.55" stop-color="#0C1A2E"/>
    <stop offset="1" stop-color="#0F1F30"/>
  </linearGradient>
  <linearGradient id="screenGlow5" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#D4AF37" stop-opacity="0.12"/>
    <stop offset="1" stop-color="#D4AF37" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="lanternGlow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#D4AF37" stop-opacity="0.35"/>
    <stop offset="1" stop-color="#D4AF37" stop-opacity="0"/>
  </radialGradient>
  <clipPath id="screenClip5"><rect x="164" y="466" width="752" height="1310" rx="46"/></clipPath>
</defs>

<rect x="0" y="0" width="1080" height="1920" fill="url(#bgGrad5)"/>

<g stroke="#D4AF37" stroke-opacity="0.10" fill="none" stroke-width="2">
  <circle cx="540" cy="300" r="230"/>
  <circle cx="540" cy="300" r="170"/>
  <g transform="translate(540,300)">
    <ellipse cx="0" cy="0" rx="230" ry="46" transform="rotate(0)"/>
    <ellipse cx="0" cy="0" rx="230" ry="46" transform="rotate(30)"/>
    <ellipse cx="0" cy="0" rx="230" ry="46" transform="rotate(60)"/>
    <ellipse cx="0" cy="0" rx="230" ry="46" transform="rotate(90)"/>
    <ellipse cx="0" cy="0" rx="230" ry="46" transform="rotate(120)"/>
    <ellipse cx="0" cy="0" rx="230" ry="46" transform="rotate(150)"/>
  </g>
</g>

<g fill="#D4AF37">
  <circle cx="115" cy="90" r="4" fill-opacity="0.8"/>
  <circle cx="965" cy="130" r="3" fill-opacity="0.6"/>
  <circle cx="215" cy="210" r="3.5" fill-opacity="0.7"/>
  <circle cx="865" cy="60" r="3" fill-opacity="0.55"/>
  <circle cx="505" cy="50" r="3" fill-opacity="0.6"/>
  <circle cx="1005" cy="335" r="3.5" fill-opacity="0.6"/>
</g>

<!-- badge -->
<rect x="90" y="150" width="470" height="66" rx="33" fill="none" stroke="#D4AF37" stroke-opacity="0.6" stroke-width="2"/>
<text x="325" y="192" text-anchor="middle" font-family="Georgia, serif" font-size="23" letter-spacing="2" fill="#D4AF37" font-weight="bold">YOUR SPIRITUAL COMPANION</text>

<!-- headline -->
<text x="90" y="300" font-family="Georgia, serif" font-size="66" font-weight="bold" fill="#F5EDE3">Sakina</text>
<text x="90" y="368" font-family="Georgia, serif" font-size="46" fill="#F5EDE3" fill-opacity="0.85">Tranquility, one verse</text>
<text x="90" y="420" font-family="Georgia, serif" font-size="46" fill="#F5EDE3" fill-opacity="0.85">at a time</text>

<!-- phone mockup -->
<rect x="140" y="490" width="800" height="1280" rx="64" fill="#0C1A2E" stroke="#D4AF37" stroke-opacity="0.35" stroke-width="3"/>
<rect x="164" y="510" width="752" height="1250" rx="46" fill="#07111E"/>
<rect x="164" y="510" width="752" height="1250" rx="46" fill="url(#screenGlow5)"/>

<g clip-path="url(#screenClip5)">
  <text x="200" y="564" font-family="Arial, sans-serif" font-size="22" fill="#F5EDE3" fill-opacity="0.7">9:41</text>
  <rect x="860" y="544" width="28" height="14" rx="3" fill="none" stroke="#F5EDE3" stroke-opacity="0.6" stroke-width="1.5"/>

  <!-- lantern mark -->
  <circle cx="540" cy="820" r="180" fill="url(#lanternGlow)"/>
  <g stroke="#D4AF37" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="540" y1="680" x2="540" y2="700"/>
    <circle cx="540" cy="672" r="8" fill="#D4AF37"/>
    <path d="M480,780 Q540,740 600,780 L600,920 Q540,950 480,920 Z" fill="#0C1A2E" fill-opacity="0.6"/>
    <line x1="500" y1="800" x2="500" y2="900"/>
    <line x1="540" y1="795" x2="540" y2="905"/>
    <line x1="580" y1="800" x2="580" y2="900"/>
    <path d="M460,920 L620,920" />
    <path d="M470,960 Q540,930 610,960" />
  </g>

  <!-- title -->
  <text x="540" y="1080" text-anchor="middle" font-family="Georgia, serif" font-size="52" font-weight="bold" fill="#F5EDE3">Welcome to Sakina</text>
  <text x="540" y="1140" text-anchor="middle" font-family="Georgia, serif" font-size="26" fill="#F5EDE3" fill-opacity="0.7">
    <tspan x="540" dy="0">Your companion for spiritual growth,</tspan>
    <tspan x="540" dy="36">guided by the wisdom of the Quran</tspan>
  </text>

  <!-- CTA -->
  <rect x="240" y="1560" width="600" height="96" rx="48" fill="#D4AF37"/>
  <text x="540" y="1618" text-anchor="middle" font-family="Georgia, serif" font-size="32" font-weight="bold" fill="#07111E">Begin Your Journey</text>
</g>

<!-- footer -->
<text x="540" y="1870" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" letter-spacing="1" fill="#F5EDE3" fill-opacity="0.55">Free to begin  ·  No sign-up required</text>
</svg>
