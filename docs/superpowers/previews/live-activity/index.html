<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sakina Live Activity Preview</title>
<style>
  /* Card values from targets/live-activity/*.swift (Current) and the three
     design directions. Colours are the app's Celestial Night tokens. */
  :root {
    --night: #07111E; --dusk: #0F1F30; --cream: #F5EDE3; --cream-2: rgba(245,237,227,.7);
    --cream-3: rgba(245,237,227,.38); --gold: #D4AF37; --gold-dim: rgba(212,175,55,.28);
    --inset: rgba(245,237,227,.07);
    --ui-bg: #0b0f15; --ui-panel: #141a22; --ui-line: #263040; --ui-text: #e6e9ee; --ui-dim: #93a0b3;
    --sys: -apple-system, "SF Pro Text", "SF Pro", "Segoe UI", system-ui, sans-serif;
    --serif: Georgia, "Times New Roman", serif;
  }
  @font-face { font-family: "AmiriQuranCard"; src: url("../../../../targets/live-activity/AmiriQuran-Regular.ttf") format("truetype"); }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--ui-bg); color: var(--ui-text); font: 14px/1.45 var(--sys);
    display: grid; grid-template-columns: minmax(420px, 1fr) 380px; gap: 24px; padding: 24px; }
  @media (max-width: 900px) { body { grid-template-columns: 1fr; } }
  h1 { font-size: 18px; margin: 0 0 4px; } h2 { font-size: 15px; margin: 0 0 4px; }
  .sub { color: var(--ui-dim); font-size: 12px; margin: 0 0 16px; }
  .num { font-variant-numeric: tabular-nums; }

  /* ── Phone ─────────────────────────────────────────────────────── */
  .stage { display: flex; flex-direction: column; align-items: center; gap: 12px; min-width: 0; }
  .scaler { transform-origin: top center; }
  .phone { position: relative; width: calc(var(--w) * 1px + 24px); height: calc(var(--h) * 1px + 24px);
    border-radius: 68px; padding: 12px; background: linear-gradient(145deg, #3a3d42, #1c1e21 40%, #2b2e33);
    box-shadow: 0 0 0 2px #50545b inset, 0 30px 80px rgba(0,0,0,.6); }
  .phone::before, .phone::after { content: ""; position: absolute; width: 4px; background: #2b2e33; border-radius: 2px; }
  .phone::before { left: -3px; top: 180px; height: 64px; box-shadow: 0 84px 0 #2b2e33; }
  .phone::after { right: -3px; top: 230px; height: 100px; }
  .camctl { position: absolute; right: -3px; top: 520px; width: 4px; height: 70px; border-radius: 2px; background: #3d4148; }
  .screen { position: relative; width: calc(var(--w) * 1px); height: calc(var(--h) * 1px); border-radius: 56px; overflow: hidden; background: #000; }
  .wallpaper { position: absolute; inset: 0; transition: filter .4s;
    background: radial-gradient(1px 1px at 20% 30%, #fff8 50%, transparent 51%), radial-gradient(1px 1px at 70% 12%, #fff9 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 85% 40%, #fffa 50%, transparent 51%), radial-gradient(1px 1px at 35% 62%, #fff7 50%, transparent 51%),
      radial-gradient(ellipse at 50% 120%, #1d3a5f 0%, #0b1626 55%, #04070c 100%); }
  .wallpaper.light { background: radial-gradient(ellipse at 50% 0%, #f6e7c9 0%, #c9d8e8 55%, #8fa9c4 100%); }
  .home-apps { position: absolute; inset: 70px 20px 120px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 22px 18px; align-content: start; }
  .home-apps i { aspect-ratio: 1; border-radius: 14px; background: #ffffff1f; }
  .status { position: absolute; top: 16px; left: 0; right: 0; display: flex; justify-content: space-between; padding: 0 34px; font: 600 16px var(--sys); color: #fff; z-index: 5; }
  .lock-clock { position: absolute; top: 92px; left: 0; right: 0; text-align: center; color: #fff; }
  .lock-clock .date { font: 600 19px var(--sys); opacity: .9; }
  .lock-clock .time { font: 700 92px/1 var(--sys); letter-spacing: -2px; margin-top: 2px; }
  .lock-bottom { position: absolute; bottom: 30px; left: 46px; right: 46px; display: flex; justify-content: space-between; }
  .lock-bottom i { width: 50px; height: 50px; border-radius: 50%; background: #ffffff26; }
  .home-bar { position: absolute; bottom: 8px; left: 50%; width: 140px; height: 5px; margin-left: -70px; border-radius: 3px; background: #fffd; z-index: 6; }

  /* ── Dynamic Island ───────────────────────────────────────────── */
  .island { position: absolute; top: 11px; left: 50%; z-index: 10; width: 126px; height: 37px; margin-left: -63px; border-radius: 19px;
    background: #000; overflow: hidden; box-shadow: 0 0 0 1px rgba(212,175,55,.5);
    transition: width .5s cubic-bezier(.2,.9,.25,1.12), height .5s cubic-bezier(.2,.9,.25,1.12), margin-left .5s cubic-bezier(.2,.9,.25,1.12), border-radius .5s cubic-bezier(.2,.9,.25,1.12); }
  .island.compact { width: 250px; margin-left: -125px; }
  .island.expanded { width: 371px; margin-left: -185.5px; height: var(--exp-h, 160px); border-radius: 44px; }
  .island > .layer { position: absolute; inset: 0; opacity: 0; transition: opacity .25s; pointer-events: none; }
  .island.compact:not(.other) > #islandCompact, .island.expanded > #islandExpanded { opacity: 1; }
  .island.expanded > #islandExpanded { pointer-events: auto; }
  .other-activity { display: none; position: absolute; inset: 0; align-items: center; justify-content: space-between; padding: 0 14px; color: #fff; font: 600 13px var(--sys); }
  .island.other > .other-activity { display: flex; }
  .minimal-dot { position: absolute; top: 11px; z-index: 10; width: 37px; height: 37px; border-radius: 50%; background: #000;
    display: none; align-items: center; justify-content: center; left: calc(50% + 74px); box-shadow: 0 0 0 1px rgba(212,175,55,.5); }
  .minimal-dot.on { display: flex; }
  .reduce .island, .reduce .fade, .reduce .banner { transition: none !important; }

  /* Shared island piece layouts */
  .c-row { display: flex; align-items: center; justify-content: space-between; height: 100%; padding: 0 14px 0 12px; }
  .lantern { display: block; width: auto; }
  .lantern.js-lamp { transition: filter .6s ease, opacity .6s ease; }

  /* ── Lock Screen Live Activity ─────────────────────────────────── */
  .banner { position: absolute; left: 11px; right: 11px; bottom: 112px; z-index: 4; border-radius: 22px; color: var(--cream);
    background: linear-gradient(var(--night), var(--dusk)); transition: transform .45s cubic-bezier(.2,.9,.25,1.05), opacity .35s; }
  .banner.hidden { transform: translateY(40px); opacity: 0; }
  .banner .close { position: absolute; top: -9px; left: -9px; width: 22px; height: 22px; border-radius: 50%; background: #3a3f47;
    color: var(--gold); font: 700 12px/22px var(--sys); text-align: center; z-index: 2; }

  /* ── Verse tiers (VerseView.swift) ─────────────────────────────── */
  .verse .tier { display: flex; flex-direction: column; gap: 4px; }
  .ar { font-family: "AmiriQuranCard", serif; font-size: 16px; color: var(--cream); direction: rtl; text-align: right; line-height: 1.55; }
  .en { font: 13px/1.3 var(--sys); color: var(--cream); }
  .ref { font: 500 11px var(--sys); color: var(--gold); }
  .ptr { font: 12px var(--sys); color: var(--cream-2); }
  .verse.big .ar { font-size: 17px; } .verse.big .en { font: 500 14px/1.32 var(--sys); }
  .show-budget .verse { outline: 1px dashed rgba(212,175,55,.6); outline-offset: 2px; }

  .fade { transition: opacity .3s ease; } .fade.out { opacity: 0; }
  .aod .wallpaper { filter: brightness(.35); } .aod .banner, .aod .island { filter: brightness(.7); }

  /* ── Design: Current ───────────────────────────────────────────── */
  .cur-exp { padding: 22px 22px 14px; display: flex; flex-direction: column; gap: 10px; height: 100%; }
  .cur-top { display: flex; justify-content: space-between; align-items: center; }
  .cur-lead { display: flex; align-items: center; gap: 8px; }
  .name { font-family: var(--serif); font-size: 18px; color: var(--cream); line-height: 1.15; }
  .clock { font: 500 13px var(--sys); color: var(--cream-2); }
  .cd { font: 600 20px var(--sys); color: var(--gold); width: 84px; text-align: right; }
  .cur-lock { padding: 14px; display: flex; flex-direction: column; gap: 8px; }
  .cur-lock .row { display: flex; align-items: center; gap: 8px; }
  .compact-time { font: 600 14px var(--sys); color: var(--gold); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 52px; text-align: right; }
  .compact-time.old { color: var(--cream); font-size: 13px; }

  /* ── Design A: Countdown hero (ride timer / tennis score) ─────── */
  .a-exp { padding: 20px 22px 14px; display: flex; flex-direction: column; gap: 10px; height: 100%; }
  .a-top { display: flex; align-items: center; justify-content: space-between; }
  .a-label { font: 600 12px var(--sys); color: var(--gold); letter-spacing: .02em; display: flex; align-items: center; gap: 6px; }
  .a-hero { font: 600 34px/1 var(--sys); color: var(--cream); letter-spacing: -.5px; margin-top: 4px; }
  .a-inset { background: var(--inset); border-radius: 16px; padding: 8px 12px; }
  .a-lock { padding: 14px; display: flex; flex-direction: column; gap: 10px; }

  /* ── Design B: Day path (UV hours / transit list) ─────────────── */
  .b-exp { padding: 20px 22px 14px; display: flex; flex-direction: column; gap: 10px; height: 100%; }
  .b-top { display: flex; align-items: center; gap: 8px; }
  .b-top .cd { margin-left: auto; font-size: 18px; }
  .path { position: relative; height: 46px; }
  .path .track { position: absolute; left: 6px; right: 6px; top: 8px; height: 4px; border-radius: 2px; background: rgba(245,237,227,.14); }
  .path .done { position: absolute; left: 6px; top: 8px; height: 4px; border-radius: 2px; background: linear-gradient(90deg, var(--gold-dim), var(--gold)); }
  .path .stop { position: absolute; top: 4px; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; background: #2a3442; border: 2px solid #000; }
  .path .stop.past { background: var(--gold-dim); }
  .path .stop.next { background: #000; border: 2px solid var(--gold); box-shadow: 0 0 10px rgba(212,175,55,.8); }
  .path .now { position: absolute; top: 2px; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%;
    background: radial-gradient(circle, #fff6d8 0%, var(--gold) 45%, rgba(212,175,55,0) 72%); }
  .path .lbl { position: absolute; top: 22px; transform: translateX(-50%); text-align: center; white-space: nowrap; }
  .path .lbl b { display: block; font: 600 10px var(--sys); color: var(--cream-2); }
  .path .lbl span { display: block; font: 500 10px var(--sys); color: var(--cream-3); }
  .path .lbl.next b { color: var(--gold); } .path .lbl.next span { color: var(--cream-2); }
  .b-lock { padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .dots5 { display: flex; gap: 5px; align-items: center; }
  .dots5 i { width: 6px; height: 6px; border-radius: 50%; background: rgba(245,237,227,.18); }
  .dots5 i.past { background: var(--gold-dim); }
  .dots5 i.next { background: var(--gold); box-shadow: 0 0 6px var(--gold); width: 8px; height: 8px; }

  /* ── Design C: Lantern glow (prayer orb / book progress) ───────── */
  .c-exp { padding: 18px 22px 14px; display: flex; flex-direction: column; gap: 10px; height: 100%; }
  .c-main { display: flex; gap: 12px; align-items: flex-start; }
  .orb { flex: none; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle, rgba(255,214,120,.55) 0%, rgba(212,175,55,.32) 38%, rgba(212,175,55,0) 70%); }
  .c-bar { display: flex; align-items: center; gap: 10px; }
  .c-bar .pname { font: 600 13px var(--sys); color: var(--gold); min-width: 0; white-space: nowrap; }
  .bar { flex: 1; height: 5px; border-radius: 3px; background: rgba(245,237,227,.14); overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 3px; background: linear-gradient(90deg, rgba(212,175,55,.5), var(--gold)); }
  .c-bar .cdsm { font: 600 13px var(--sys); color: var(--cream-2); }
  .c-lock { padding: 14px; display: flex; flex-direction: column; gap: 10px; }

  /* ── Design D: B + C, "Lantern path" ───────────────────────────── */
  .d-row { display: flex; align-items: center; gap: 10px; }
  .dpath { position: relative; flex: 1; height: 34px; min-width: 0; }
  .dpath .track { position: absolute; left: 0; right: 0; top: 9px; height: 3px; border-radius: 2px; background: rgba(245,237,227,.14); }
  .dpath .done { position: absolute; left: 0; top: 9px; height: 3px; border-radius: 2px; background: linear-gradient(90deg, rgba(212,175,55,.35), var(--gold)); }
  .dpath .stop { position: absolute; top: 6px; width: 9px; height: 9px; margin-left: -4.5px; border-radius: 50%; background: #2a3442; border: 1.5px solid #000; }
  .dpath .stop.past { background: rgba(212,175,55,.45); }
  .dpath .stop.next { background: #000; border: 2px solid var(--gold); box-shadow: 0 0 8px rgba(212,175,55,.85); }
  .dpath .lbl { position: absolute; top: 20px; transform: translateX(-50%); white-space: nowrap; font: 600 9px var(--sys); color: var(--cream-3); }
  .dpath .lbl.next { color: var(--gold); font-size: 10px; }

  /* ── Design E: D after the design review, "Lantern string" ─────── */
  /* The lantern is the marker: it hangs lit at the next prayer on a thin
     string, the other four prayers are small unlit lanterns. One glow (the
     lit lantern's own shape), gold only on that lantern and its label. */
  .glow { filter: drop-shadow(0 0 5px rgba(255,214,120,.65)); }
  .e-lock { position: relative; padding: 16px 14px 14px; display: flex; flex-direction: column; gap: 10px; }
  .e-lock::before { content: ""; position: absolute; top: 0; left: 28px; right: 28px; height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent); }
  .e-row { display: flex; align-items: flex-end; gap: 10px; }
  .e-row .cdsm { font: 600 13px/14px var(--sys); color: var(--cream-2); width: 64px; text-align: right; }
  .gar { position: relative; flex: 1; height: 36px; min-width: 0; }
  .gar .rope { position: absolute; left: 0; right: 0; top: 3px; height: 1px; background: rgba(245,237,227,.2); }
  .gar .fill { position: absolute; left: 0; top: 2.5px; height: 2px; border-radius: 1px; background: rgba(212,175,55,.6); }
  .gar .lamp { position: absolute; top: 3px; width: 6px; height: 11px; transform: translateX(-50%);
    -webkit-mask: var(--lantern) center / contain no-repeat; mask: var(--lantern) center / contain no-repeat;
    background: rgba(245,237,227,.3); }
  .gar .lamp.past { background: rgba(212,175,55,.5); }
  .gar .lit { position: absolute; top: 3px; height: 18px; transform: translateX(-50%); }
  .gar .lbl { position: absolute; top: 23px; white-space: nowrap; font: 600 11px/13px var(--sys); color: var(--gold); transform: translateX(-50%); }
  .gar .lbl.first { transform: translateX(-3px); } .gar .lbl.last { transform: translateX(calc(-100% + 3px)); }
  .verse.e .en { font: 13px/1.3 var(--serif); color: rgba(245,237,227,.88); }
  .verse.e .ref { font: italic 12px var(--serif); color: var(--cream-2); }
  .verse.e .ptr { font: italic 13px var(--serif); color: var(--cream-2); }

  /* ── The home screen's mandala, behind the card's content ── */
  .mandala { position: absolute; pointer-events: none; }
  .m-lock { right: -70px; top: 50%; margin-top: -125px; }
  .m-exp { left: -24px; top: -26px; }
  .e-lock { overflow: hidden; border-radius: inherit; }
  .e-lock > :not(.mandala), .c-exp > :not(.mandala) { position: relative; }

  /* ── F · Day segments ── */
  .f-row { display: flex; align-items: center; gap: 10px; }
  .f-row .cdsm, .h-row .cdsm { font: 600 13px var(--sys); color: var(--cream-2); width: 64px; text-align: right; flex: none; }
  .f-segs { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  .seg5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; }
  .seg5 .s { position: relative; height: 4px; border-radius: 2px; background: rgba(245,237,227,.14); overflow: hidden; }
  .seg5 .s.past { background: rgba(212,175,55,.45); }
  .seg5 .s i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--gold); border-radius: 2px; }
  .seg5l .l { white-space: nowrap; font: 600 11px/13px var(--sys); color: var(--gold); }
  .seg5l .l.end { justify-self: end; }
  .bar.thin { height: 3px; }

  /* ── G · Prayer board ── */
  .board { display: flex; align-items: stretch; height: 40px; }
  .board .col { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; }
  .board .col b { font: 600 11px/13px var(--sys); color: rgba(245,237,227,.8); }
  .board .col span { font: 600 13px/16px var(--sys); color: rgba(245,237,227,.8); }
  .board .col.past b, .board .col.past span { color: rgba(245,237,227,.55); }
  .board .col.next b, .board .col.next span { color: var(--gold); }
  .board .ul { width: 60%; height: 2px; margin-top: 4px; border-radius: 1px; background: rgba(245,237,227,.14); overflow: hidden; }
  .board .ul i { display: block; height: 100%; background: var(--gold); }
  .board .side { flex: none; width: 64px; border-left: 1px solid rgba(245,237,227,.12); display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 4px; }
  .board .side span { font: 600 12px var(--sys); color: var(--cream-2); }

  /* ── I1–I3 · interactions ── */
  .ia-btn { position: absolute; width: 30px; height: 30px; border: 0; padding: 0; background: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center; }
  .e-lock > .ia-btn, .c-exp > .ia-btn { position: absolute; }  /* beats the content-above-mandala rule */
  .ia-lock { top: 10px; right: 8px; }
  .ia-exp { top: 66px; right: 14px; }
  .board button.side { border: 0; border-left: 1px solid rgba(245,237,227,.12); background: none; cursor: pointer; padding: 0; width: 76px; }
  .tas-n { font: 600 14px/16px var(--sys); color: var(--gold); }
  .tas-n small { font-size: 11px; color: var(--cream-2); font-weight: 500; }
  .tas-p { font: 600 11px/13px var(--sys); color: var(--cream-2); white-space: nowrap; }
  .tas-p.gold { color: var(--gold); }
  .tas-x { font: 600 12px/14px var(--sys); color: var(--gold); }
  .tas-pips { display: flex; gap: 4px; margin-top: 2px; }
  .tas-pips i { width: 4px; height: 4px; border-radius: 50%; background: rgba(245,237,227,.25); }
  .tas-pips i.on { background: var(--gold); }
  /* Unlit = dim gold, no glow: "waiting", not "switched off" (grey read as broken). */
  .lantern.unlit { filter: none; opacity: .45; }
  .ia-ring { position: relative; border: 0; padding: 0; background: none; cursor: pointer; display: flex; align-items: center; justify-content: center; }

  /* ── H · Lantern ring ── */
  .h-row { display: flex; align-items: center; gap: 10px; }
  .h-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
  .pips { display: flex; gap: 5px; }
  .pips i { width: 5px; height: 5px; border-radius: 50%; background: rgba(245,237,227,.25); }
  .pips i.past { background: rgba(212,175,55,.5); }
  .pips i.next { background: var(--gold); }

  /* ── Gallery ───────────────────────────────────────────────────── */
  .gallery { width: 100%; display: none; flex-direction: column; gap: 28px; padding: 8px 0 40px; }
  .gallery.on { display: flex; }
  .gal-design { background: #05070a; border: 1px solid var(--ui-line); border-radius: 18px; padding: 18px; }
  .gal-design p { color: var(--ui-dim); font-size: 12px; margin: 0 0 14px; }
  .gal-row { display: flex; flex-wrap: wrap; gap: 22px; align-items: flex-start; }
  .gal-item { display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .gal-item small { color: var(--ui-dim); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
  .g-island { position: relative; background: #000; overflow: hidden; box-shadow: 0 0 0 1px rgba(212,175,55,.5); }
  .g-min { width: 37px; height: 37px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .g-cmp { width: 250px; height: 37px; border-radius: 19px; }
  .g-exp { width: 371px; border-radius: 44px; }
  .g-lock { width: 371px; border-radius: 22px; background: linear-gradient(var(--night), var(--dusk)); color: var(--cream); position: relative; }

  /* ── Control panel ─────────────────────────────────────────────── */
  .panel { background: var(--ui-panel); border: 1px solid var(--ui-line); border-radius: 14px; padding: 18px; align-self: start; position: sticky; top: 24px; }
  .group { border-top: 1px solid var(--ui-line); padding-top: 14px; margin-top: 14px; }
  .group:first-of-type { border-top: 0; margin-top: 0; padding-top: 0; }
  .label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--ui-dim); margin-bottom: 8px; }
  .seg { display: flex; flex-wrap: wrap; gap: 6px; }
  .seg button, .btn { background: #1d2531; color: var(--ui-text); border: 1px solid var(--ui-line); border-radius: 8px; padding: 7px 10px; font: 500 13px var(--sys); cursor: pointer; }
  .seg button.on { background: var(--gold); color: #111; border-color: var(--gold); }
  .btn.primary { background: #2a3a52; border-color: #3b5272; }
  .btn:hover, .seg button:hover { filter: brightness(1.15); }
  select, input[type=range] { width: 100%; }
  select { background: #1d2531; color: var(--ui-text); border: 1px solid var(--ui-line); border-radius: 8px; padding: 7px; font: 13px var(--sys); }
  .row2 { display: flex; gap: 8px; align-items: center; }
  .note { color: var(--ui-dim); font-size: 12px; margin-top: 6px; }
  .check { display: flex; align-items: center; gap: 8px; margin: 6px 0; cursor: pointer; }
  .tierinfo { font-size: 12px; background: #0f141b; border-radius: 8px; padding: 8px 10px; margin-top: 8px; }
  .tierinfo b { color: var(--gold); }

</style>
</head>

<script>
const LANTERN = '../../../../src/assets/brand/lantern.png';
const PRAYERS = [
  { name: 'Fajr', h: 5, m: 1 }, { name: 'Dhuhr', h: 12, m: 8 }, { name: 'Asr', h: 15, m: 22 },
  { name: 'Maghrib', h: 17, m: 44 }, { name: 'Isha', h: 19, m: 1 },
];
const $ = (id) => document.getElementById(id);
const pad = (n) => String(n).padStart(2, '0');
const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
document.documentElement.style.setProperty('--lantern', `url("${LANTERN}")`);
const lantern = (h) => `<img class="lantern" alt="" src="${LANTERN}" style="height:${h}px">`;

const state = { design: 'i4', view: 'lock', size: [402, 874], prayer: 2, fmt: '24h', speed: 1,
  verse: 0, verseNone: false, mandala: true, saved: false, tasbih: { phase: 0 }, lit: false, simNow: null, target: null, reduce: false, gallery: false };
let verses = [];

/* ── Time model ────────────────────────────────────────────────── */
function occurrenceAfter(i, after) {
  const d = new Date(after); d.setHours(PRAYERS[i].h, PRAYERS[i].m, 0, 0);
  if (d <= after) d.setDate(d.getDate() + 1);
  return d;
}
function previousPrayerDate() {
  const i = (state.prayer + 4) % 5; const d = new Date(state.target);
  d.setHours(PRAYERS[i].h, PRAYERS[i].m, 0, 0);
  if (d >= state.target) d.setDate(d.getDate() - 1);
  return d;
}
function fmtClock(d, full) {
  let h = d.getHours(); const m = pad(d.getMinutes());
  if (state.fmt === '24h') return `${pad(h)}:${m}`;
  const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12;
  return full ? `${h}:${m} ${ap}` : `${h}:${m}`;
}
function fmtCountdown(ms) {   // Text(timerInterval:countsDown:)
  const s = Math.max(0, Math.round(ms / 1000));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  return h > 0 ? `${h}:${pad(m)}:${pad(sec)}` : `${m}:${pad(sec)}`;
}
// Day path: the five prayers evenly spaced (time-proportional spacing crowds
// Maghrib and Isha into each other). "Now" moves from the last prayer to the next.
const STOP_PCT = [8, 29, 50, 71, 92];
function model() {
  const t = state.target, prev = previousPrayerDate(), now = state.simNow;
  const p = PRAYERS[state.prayer];
  const progress = Math.min(1, Math.max(0, (now - prev) / (t - prev)));
  // Before Fajr the path starts empty and fills toward Fajr's stop.
  const from = state.prayer === 0 ? 0 : STOP_PCT[state.prayer - 1];
  return {
    name: p.name, idx: state.prayer, full: fmtClock(t, true), short: fmtClock(t, false),
    cd: fmtCountdown(t - now), left: t - now, progress,
    nowPct: from + (STOP_PCT[state.prayer] - from) * progress,
  };
}

/* ── Pieces ────────────────────────────────────────────────────── */
// A ring the system can draw live: ProgressView(timerInterval:) with a
// circular style (verify the circular style renders in a Live Activity).
function ring(d, stroke, inner) {
  const r = (d - stroke) / 2, c = 2 * Math.PI * r;
  return `<div style="position:relative;width:${d}px;height:${d}px;flex:none">
    <svg width="${d}" height="${d}" style="position:absolute;inset:0;transform:rotate(-90deg)">
      <circle cx="${d / 2}" cy="${d / 2}" r="${r}" fill="none" stroke="rgba(245,237,227,.14)" stroke-width="${stroke}"/>
      <circle class="js-ring" data-c="${c}" cx="${d / 2}" cy="${d / 2}" r="${r}" fill="none" stroke="#D4AF37" stroke-width="${stroke}"
        stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c}"/>
    </svg>
    <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center">${inner || ''}</div></div>`;
}
function dayPath(m) {
  const stops = PRAYERS.map((p, i) => {
    const pct = STOP_PCT[i];
    const cls = i === m.idx ? 'next' : i < m.idx ? 'past' : '';
    const time = state.fmt === '24h' ? `${pad(p.h)}:${pad(p.m)}` : `${p.h % 12 || 12}:${pad(p.m)}`;
    return `<i class="stop ${cls}" style="left:calc(6px + (100% - 12px) * ${pct / 100})"></i>
      <div class="lbl ${i === m.idx ? 'next' : ''}" style="left:calc(6px + (100% - 12px) * ${pct / 100})"><b>${p.name}</b><span class="num">${time}</span></div>`;
  }).join('');
  return `<div class="path"><div class="track"></div><div class="done js-daydone"></div>${stops}<div class="now js-now"></div></div>`;
}
function dots5(m) {
  return `<div class="dots5">${PRAYERS.map((p, i) => `<i class="${i === m.idx ? 'next' : i < m.idx ? 'past' : ''}"></i>`).join('')}</div>`;
}
// D's path: the five prayers evenly spaced on one line, past ones lit dim gold,
// the next one ringed and named with its time. No moving glow dot: a Live
// Activity cannot run its own animation, so on the phone only the line itself
// fills (ProgressView(timerInterval:), advanced by iOS). This matches that.
function lanternPath(m) {
  const stops = PRAYERS.map((p, i) => {
    const cls = i === m.idx ? 'next' : i < m.idx ? 'past' : '';
    const label = i === m.idx ? `${esc(p.name)} <span class="num">${esc(m.short)}</span>` : esc(p.name);
    return `<i class="stop ${cls}" style="left:${STOP_PCT[i]}%"></i><div class="lbl ${i === m.idx ? 'next' : ''}" style="left:${STOP_PCT[i]}%">${label}</div>`;
  }).join('');
  return `<div class="dpath"><div class="track"></div><div class="done js-dpdone"></div>${stops}</div>`;
}
// E's string: the five prayers evenly spaced; the next is the lit lantern,
// labelled with its time; passed prayers are dim gold, later ones unlit.
function lanternString(m) {
  const lamps = PRAYERS.map((p, i) => i === m.idx
    ? `<img class="lit glow" alt="" src="${LANTERN}" style="left:${STOP_PCT[i]}%">`
    : `<i class="lamp ${i < m.idx ? 'past' : ''}" style="left:${STOP_PCT[i]}%"></i>`).join('');
  const edge = m.idx === 0 ? 'first' : m.idx === 4 ? 'last' : '';
  return `<div class="gar"><div class="rope"></div><div class="fill js-dpdone"></div>${lamps}
    <div class="lbl ${edge}" style="left:${STOP_PCT[m.idx]}%">${esc(m.name)} <span class="num">${esc(m.short)}</span></div></div>`;
}
// The home screen's mandala, drawn the same way (AnimatedMandala.tsx).
function mandalaSVG(size, opacity, k = 1) {  // k = strokeScale, as AnimatedMandala uses at small sizes
  const C = 50, R = 48;
  const web = (step) => {
    let d = '';
    for (let i = 0; i < 12; i++) {
      const a1 = (i * Math.PI * 2) / 12 - Math.PI / 2, a2 = ((i + step) * Math.PI * 2) / 12 - Math.PI / 2;
      d += `M ${C + R * Math.cos(a1)},${C + R * Math.sin(a1)} L ${C + R * Math.cos(a2)},${C + R * Math.sin(a2)} `;
    }
    return d;
  };
  return `<svg width="${size}" height="${size}" viewBox="0 0 100 100" style="opacity:${opacity};display:block">
    <g fill="none" stroke="#D4AF37" stroke-linejoin="round" stroke-linecap="round">
      <circle cx="50" cy="50" r="${R}" stroke-width="${0.3 * k}" opacity="0.5"/>
      <path d="${web(3)}" stroke-width="${0.16 * k}" opacity="0.24"/>
      <path d="${web(4)}" stroke-width="${0.16 * k}" opacity="0.34"/>
      <circle cx="50" cy="50" r="${R * 0.5}" stroke-width="${0.14 * k}" opacity="0.2"/>
      <circle cx="50" cy="50" r="${R * 0.18}" stroke-width="${0.3 * k}" opacity="0.5"/>
    </g></svg>`;
}
// Outer + inner (220/300 of it, turned half a point so the two lattices interleave).
function mandala(cls, size, k = 1) {
  if (!state.mandala) return '';
  const inner = Math.round(size * 220 / 300), off = (size - inner) / 2;
  return `<div class="mandala ${cls}" style="width:${size}px;height:${size}px">${mandalaSVG(size, 0.35, k)}
    <div style="position:absolute;left:${off}px;top:${off}px;transform:rotate(15deg)">${mandalaSVG(inner, 0.25, k)}</div></div>`;
}
// Expanded island's top: glowing lantern (leading), name / time / countdown (trailing).
const topBlock = (m) => `<div style="display:flex;justify-content:space-between;align-items:flex-start;height:50px">
    <img class="lantern glow" alt="" src="${LANTERN}" style="height:26px;margin:8px 0 0 6px">
    <div class="fade js-swap" style="text-align:right;line-height:1.15"><div class="name" style="font-size:16px">${esc(m.name)}</div>
      <div class="num" style="font:600 13px/16px var(--sys);color:var(--gold)">${esc(m.full)}</div>
      <div class="num js-cd" style="font:500 12px/15px var(--sys);color:var(--cream-2)"></div></div></div>`;
// F: five segments, one per stretch before each prayer; the current one fills live.
function segments(m, label) {
  const segs = PRAYERS.map((p, i) => `<div class="s ${i < m.idx ? 'past' : ''}">${i === m.idx ? '<i class="js-bar"></i>' : ''}</div>`).join('');
  const lbl = label ? `<div class="seg5 seg5l"><div class="l ${m.idx === 4 ? 'end' : ''}" style="grid-column:${m.idx + 1}">${esc(m.name)} <span class="num">${esc(m.short)}</span></div></div>` : '';
  return `<div class="f-segs"><div class="seg5">${segs}</div>${lbl}</div>`;
}
// G: the masjid board, five columns plus the lantern and countdown.
function board(m, side) {
  const cols = PRAYERS.map((p, i) => {
    const d = new Date(state.target); d.setHours(p.h, p.m);
    const cls = i === m.idx ? 'next' : i < m.idx ? 'past' : '';
    return `<div class="col ${cls}"><b>${esc(p.name)}</b><span class="num">${esc(fmtClock(d, false))}</span>${i === m.idx ? '<div class="ul"><i class="js-bar"></i></div>' : ''}</div>`;
  }).join('');
  return `<div class="board">${cols}${side || `<div class="side"><img class="lantern glow" alt="" src="${LANTERN}" style="height:16px"><span class="num js-cd"></span></div>`}</div>`;
}
/* ── Interactions (I1–I3): buttons a Live Activity can carry ─────────
   On the phone each is a SwiftUI Button(intent:) running a LiveActivityIntent
   in the app's process, which then updates the card. They work on the Lock
   Screen and in the expanded island only; compact and minimal just open the
   app. Here they are clickable so they can be tried. */
const ICON_SAVE = (on) => `<svg width="17" height="17" viewBox="0 0 24 24" fill="${on ? '#D4AF37' : 'none'}" stroke="${on ? '#D4AF37' : 'rgba(245,237,227,.75)'}" stroke-width="1.8" stroke-linejoin="round"><path d="M6.5 3.5h11v17l-5.5-3.8-5.5 3.8z"/></svg>`;
const ICON_NEXT = `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="rgba(245,237,227,.75)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3"/><path d="M19.5 4.5v4.2h-4.2"/></svg>`;
function iaButton(kind, cls) {
  if (kind === 'save') return `<button class="ia-btn ${cls}" onclick="iaSave()" aria-label="${state.saved ? 'Saved to Library' : 'Save this verse'}">${ICON_SAVE(state.saved)}</button>`;
  return `<button class="ia-btn ${cls}" onclick="iaNext()" aria-label="Another verse">${ICON_NEXT}</button>`;
}
function iaSave() { state.saved = !state.saved; render(); }
function iaNext() { state.saved = false; newMoodVerse(); }
// I3 Tasbih in three taps: you count on your fingers, the card only keeps
// your place. One tap per phrase, then "Done"; a tap after Done starts again.
const TASBIH = ['SubhanAllah', 'Alhamdulillah', 'Allahu Akbar'];
function iaTasbih() {
  const t = state.tasbih;
  t.phase = t.phase >= 3 ? 0 : t.phase + 1;
  render();
}
const tasPips = (phase) => `<span class="tas-pips">${[0, 1, 2].map((i) => `<i class="${i < phase ? 'on' : ''}"></i>`).join('')}</span>`;
function tasbihCell() {
  const t = state.tasbih, done = t.phase >= 3;
  return `<button class="side tas" onclick="iaTasbih()" aria-label="${done ? 'Tasbih done, tap to start again' : `Said ${TASBIH[t.phase]} 33 times`}">
    <span class="tas-p ${done ? 'gold' : ''}">${done ? 'Done ✓' : TASBIH[t.phase]}</span>
    <span class="tas-x num">${done ? '' : '×33'}</span>${tasPips(t.phase)}</button>`;
}
function tasbihRing(d) {   // the expanded island's lantern, ringed in thirds
  const t = state.tasbih, frac = Math.min(1, t.phase / 3), r = (d - 3) / 2, c = 2 * Math.PI * r;
  return `<button class="ia-ring" onclick="iaTasbih()" aria-label="Tap to count" style="width:${d}px;height:${d}px">
    <svg width="${d}" height="${d}" style="position:absolute;inset:0;transform:rotate(-90deg)">
      <circle cx="${d / 2}" cy="${d / 2}" r="${r}" fill="none" stroke="rgba(245,237,227,.14)" stroke-width="3"/>
      <circle cx="${d / 2}" cy="${d / 2}" r="${r}" fill="none" stroke="#D4AF37" stroke-width="3" stroke-linecap="round"
        stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - frac)}"/></svg>
    <img class="lantern glow" alt="" src="${LANTERN}" style="height:20px;position:relative"></button>`;
}
const tasbihLine = () => { const t = state.tasbih; return t.phase >= 3 ? 'Tasbih done ✓' : `${TASBIH[t.phase]} ×33 · ${t.phase + 1} of 3`; };

// I4 Light the lantern: one remembrance for each stretch between prayers.
// The lantern waits unlit; say the words, tap once, and it lights. The next
// prayer brings a new phrase and an unlit lantern. Undo with a second tap.
const DHIKR = ['SubhanAllah', 'Alhamdulillah', 'La ilaha illallah', 'Allahu Akbar', 'Astaghfirullah'];
function iaLight() {
  const was = state.lit;
  state.lit = !state.lit; render();
  if (state.reduce) return;
  // Start the fresh lanterns in the old state, then let them ease to the new one.
  const lamps = document.querySelectorAll('.js-lamp');
  lamps.forEach((el) => { el.classList.toggle('glow', was); el.classList.toggle('unlit', !was); });
  void document.body.offsetWidth;
  lamps.forEach((el) => { el.classList.toggle('glow', state.lit); el.classList.toggle('unlit', !state.lit); });
}
function lightCell(m) {
  // 86 wide: "La ilaha illallah" at 11 pt is ~80 pt.
  return `<button class="side tas" style="width:86px" onclick="iaLight()" aria-label="${state.lit ? 'Lantern lit' : `Say ${DHIKR[m.idx]}, then tap`}">
    <img class="lantern js-lamp ${state.lit ? 'glow' : 'unlit'}" alt="" src="${LANTERN}" style="height:18px">
    <span class="tas-p ${state.lit ? 'gold' : ''}">${DHIKR[m.idx]}</span></button>`;
}
function lightLantern(h) {
  return `<button class="ia-ring" onclick="iaLight()" aria-label="${state.lit ? 'Lantern lit' : 'Tap after saying it'}" style="width:44px;height:44px">
    <img class="lantern js-lamp ${state.lit ? 'glow' : 'unlit'}" alt="" src="${LANTERN}" style="height:${h}px"></button>`;
}

// H: five pips for the day.
const pips = (m) => `<div class="pips">${PRAYERS.map((p, i) => `<i class="${i === m.idx ? 'next' : i < m.idx ? 'past' : ''}"></i>`).join('')}</div>`;
const verseBox = (w, h, big, style) => `<div class="verse js-verse ${big ? 'big' : ''} ${style || ''} fade js-swapv" data-w="${w}" data-h="${h}" style="max-width:${w}px"></div>`;

/* ── Designs ───────────────────────────────────────────────────── */
// Each returns HTML for minimal, compact, expanded and lock. Verse budgets keep
// every card at or under Apple's 160 pt and never clip an ayah (ViewThatFits).
const DESIGNS = {
  f: {
    title: 'F · Day segments',
    note: 'The day as five segments, one for the stretch before each prayer (B\'s whole-day view, without dots or a marker). Passed stretches are dim gold, the current one fills live like C\'s bar, the rest are faint; only the next prayer is named, under its own segment. Verse first in the app\'s Verse of the Day type, glowing lantern, quiet countdown (C).',
    expH: 160,
    minimal: () => `<img class="lantern glow" alt="" src="${LANTERN}" style="height:20px">`,
    compact: (m) => `<div class="c-row"><img class="lantern glow" alt="" src="${LANTERN}" style="height:20px">
        <span class="compact-time num fade js-swap">${esc(m.short)}</span></div>`,
    // The day row stays on the Lock Screen; here it would cost the verse its
    // room (62 pt: English for 17 verses, 35 reference only). 72 pt: 4/32/16.
    // 160 >= 10 padding + 50 top block + 8 + 72 verse + 12.
    expanded: (m) => `<div class="c-exp" style="padding:10px 22px 12px;gap:8px;position:relative">${mandala('m-exp', 130, 2.5)}${topBlock(m)}
        ${verseBox(327, 72, false, 'e')}</div>`,
    // 160 >= 30 padding + 90 verse + 10 + 24 row.

/* ── Verse fitting (mirrors VerseView's ViewThatFits) ─────────── */
function tierHTML(v, tier, e) {
  const ref = (e ? '— ' : '') + v.ref;
  if (tier === 1) return `<div class="tier"><div class="ar">${esc(v.arabic)}</div><div class="en">${esc(v.english)}</div><div class="ref">${esc(ref)}</div></div>`;
  if (tier === 2) return `<div class="tier"><div class="en">${esc(v.english)}</div><div class="ref">${esc(ref)}</div></div>`;
  return `<div class="tier"><div class="ptr">Your verse · ${esc(v.ref)}</div></div>`;
}
const TIER_NAMES = { 1: 'Arabic + English', 2: 'English only', 3: 'reference only' };
function pickTier(v, width, budget, big, e) {
  const m = $('measure'); m.className = 'verse' + (big ? ' big' : '') + (e ? ' e' : '');
  for (const tier of [1, 2, 3]) {
    m.style.width = width + 'px'; m.innerHTML = tierHTML(v, tier, e);
    const h = m.firstElementChild.getBoundingClientRect().height;
    if (h <= budget || tier === 3) return { tier, h: Math.ceil(h) };
  }
}
function fillVerses(root) {
  const v = state.verseNone ? null : verses[state.verse]; const out = [];
  root.querySelectorAll('.js-verse').forEach((el) => {
    const w = Number(el.dataset.w), h = Number(el.dataset.h);
    if (!v) { el.innerHTML = ''; el.style.height = '0'; return; }
    const e = el.classList.contains('e');
    const { tier, h: used } = pickTier(v, w, h, el.classList.contains('big'), e);
    el.innerHTML = tierHTML(v, tier, e); el.style.height = h + 'px'; el.style.overflow = 'visible';
    out.push({ tier, used, h });
  });
  return out;
}

/* ── Render ────────────────────────────────────────────────────── */
function lockWidth() { return state.size[0] - 22; }
function render() {
  const d = DESIGNS[state.design], m = model();
  $('islandCompact').innerHTML = d.compact(m);
  $('islandExpanded').innerHTML = d.expanded(m);
  $('minimalDot').innerHTML = d.minimal(m);
  $('bannerBody').innerHTML = d.lock(m, lockWidth());
  $('island').style.setProperty('--exp-h', d.expH + 'px');
  $('designNote').textContent = d.note;
  const fits = fillVerses(document.querySelector('.screen'));
  const v = state.verseNone ? null : verses[state.verse];
  const lockFit = fits[fits.length - 1], expFit = fits[0];
  $('tierInfo').innerHTML = v
    ? `${esc(v.ref)}<br>Lock Screen shows <b>${TIER_NAMES[lockFit.tier]}</b> (${lockFit.used} of ${lockFit.h} pt)<br>Expanded island shows <b>${TIER_NAMES[expFit.tier]}</b> (${expFit.used} of ${expFit.h} pt)`
    : 'No verse shown';
  if (state.gallery) renderGallery();
  tick();
}
function renderGallery() {
  const m = model();
  $('gallery').innerHTML = Object.entries(DESIGNS).map(([key, d]) => `
    <div class="gal-design"><h2>${esc(d.title)}</h2><p>${esc(d.note)}</p>
      <div class="gal-row">
        <div class="gal-item"><div class="g-island g-min">${d.minimal(m)}</div><small>Minimal</small></div>
        <div class="gal-item"><div class="g-island g-cmp">${d.compact(m)}</div><small>Compact</small></div>
        <div class="gal-item"><div class="g-island g-exp" style="height:${d.expH}px">${d.expanded(m)}</div><small>Expanded</small></div>
        <div class="gal-item"><div class="g-lock">${d.lock(m, 371)}</div><small>Lock Screen</small></div>
      </div></div>`).join('');
  fillVerses($('gallery'));
}

function tick() {
  const m = model();
  document.querySelectorAll('.js-cd').forEach((el) => { el.textContent = m.cd; });
  document.querySelectorAll('.js-ring').forEach((el) => { const c = Number(el.dataset.c); el.setAttribute('stroke-dashoffset', String(c * (1 - m.progress))); });
  document.querySelectorAll('.js-bar').forEach((el) => { el.style.width = (m.progress * 100).toFixed(2) + '%'; });
  document.querySelectorAll('.js-now').forEach((el) => { el.style.left = `calc(6px + (100% - 12px) * ${m.nowPct / 100})`; });
  document.querySelectorAll('.js-daydone').forEach((el) => { el.style.width = `calc((100% - 12px) * ${m.nowPct / 100})`; });
  document.querySelectorAll('.js-dpdone').forEach((el) => { el.style.width = m.nowPct + '%'; });
  const n = state.simNow;
  const clock = state.fmt === '24h' ? `${pad(n.getHours())}:${pad(n.getMinutes())}` : `${n.getHours() % 12 || 12}:${pad(n.getMinutes())}`;
  $('statusTime').textContent = clock; $('lockTime').textContent = clock;
  $('lockDate').textContent = n.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });
  const mins = Math.max(0, Math.round(m.left / 60000));
  $('minsLabel').textContent = `(${Math.floor(mins / 60)}h ${mins % 60}m)`;
  $('minsRange').value = Math.min(480, mins);
  if (m.left <= 0 && !arriving) prayerArrives();
}

const CAPTIONS = {
  lock: 'Lock Screen: every iPhone shows this, and older iPhones without the island show only this. Tap opens Prayer Times.',
  compact: 'Compact: the island while you use other apps.',
  expanded: 'Expanded: touch and hold the island.',
  minimal: 'Minimal: another app (music here) also has a Live Activity, so Sakina shrinks to the detached circle.',
};
function applyView() {
  const v = state.view, island = $('island'), onLock = v === 'lock';
  island.classList.toggle('compact', v === 'compact' || v === 'minimal');
  island.classList.toggle('expanded', v === 'expanded');
  island.classList.toggle('other', v === 'minimal');
  $('minimalDot').classList.toggle('on', v === 'minimal');
  $('banner').classList.toggle('hidden', !onLock);
  $('lockClock').style.display = onLock ? '' : 'none';
  $('lockBottom').style.display = onLock ? '' : 'none';
  $('homeApps').style.display = onLock ? 'none' : '';
  document.querySelectorAll('#viewSeg button').forEach((b) => b.classList.toggle('on', b.dataset.v === v));
  $('caption').textContent = CAPTIONS[v];
}
function setView(v) { state.view = v; applyView(); }

/* ── Animations ────────────────────────────────────────────────── */
function fadeSwap(change) {
  if (state.reduce) { change(); return Promise.resolve(); }
  document.querySelectorAll('.js-swap').forEach((e) => e.classList.add('out'));
  return new Promise((r) => setTimeout(() => {
    change();
    // render() rebuilt the pieces; start them faded and fade them in.
    const fresh = document.querySelectorAll('.js-swap');
    fresh.forEach((e) => e.classList.add('out'));
    requestAnimationFrame(() => requestAnimationFrame(() => fresh.forEach((e) => e.classList.remove('out'))));
    setTimeout(r, 320);
  }, 300));
}
let arriving = false;
async function prayerArrives() {
  arriving = true;
  const next = (state.prayer + 1) % PRAYERS.length;
  await fadeSwap(() => {
    state.target = occurrenceAfter(next, state.target);
    state.prayer = next; state.lit = false; $('prayerSel').value = String(next); render();
  });
  arriving = false;
}
let pressTimer = null;
function touchAndHold() {
  const back = state.view === 'lock' || state.view === 'expanded' ? 'compact' : state.view;
  setView('expanded'); clearTimeout(pressTimer);
  pressTimer = setTimeout(() => setView(back), 3500);
}
function serverStart() {
  if (state.view === 'lock') { $('banner').classList.add('hidden'); setTimeout(() => $('banner').classList.remove('hidden'), 350); return; }
  $('island').classList.remove('compact', 'expanded', 'other'); $('minimalDot').classList.remove('on');
  clearTimeout(pressTimer);
  setTimeout(() => setView('expanded'), 250);
  pressTimer = setTimeout(() => setView('compact'), 3200);
}
function newMoodVerse() {
  const swap = () => { state.verseNone = false; state.verse = (state.verse + 7) % verses.length; $('verseSel').value = String(state.verse); render(); };
  if (state.reduce) return swap();
  document.querySelectorAll('.js-swapv').forEach((e) => e.classList.add('out'));
  setTimeout(() => {
    swap();
    const fresh = document.querySelectorAll('.js-swapv'); fresh.forEach((e) => e.classList.add('out'));
    requestAnimationFrame(() => requestAnimationFrame(() => fresh.forEach((e) => e.classList.remove('out'))));
  }, 300);
}

/* ── Loop & wiring ─────────────────────────────────────────────── */
let last = performance.now();
function loop(now) {
  const dt = now - last; last = now;
  if (state.speed > 0) { state.simNow = new Date(state.simNow.getTime() + dt * state.speed); tick(); }
  requestAnimationFrame(loop);
}
function setMinutes(mins) { state.simNow = new Date(state.target.getTime() - mins * 60000); render(); }
function fitScale() {
  const [, h] = state.size; const s = Math.min(1, (window.innerHeight - 140) / (h + 24));
  $('scaler').style.transform = `scale(${s})`; $('scaler').style.height = (h + 24) * s + 'px';
}
function applySize() {
  const [w, h] = state.size;
  for (const id of ['phone', 'screen']) { $(id).style.setProperty('--w', w); $(id).style.setProperty('--h', h); }
  $('deviceLabel').textContent = `iPhone Pro, ${w} × ${h} pt. The frame is a drawing of a current Pro (side buttons, Camera Control); the island is drawn at today's size, since Apple has not published the iPhone 18 island's size. Card sizes, fonts and colours follow the Swift code.`;
  fitScale(); render();
}
function seg(id, attr, on) {
  document.querySelectorAll(`#${id} button`).forEach((b) => b.onclick = () => {
    document.querySelectorAll(`#${id} button`).forEach((x) => x.classList.toggle('on', x === b));
    on(b.dataset[attr]);
  });
}

async function init() {
  verses = await (await fetch('verses.json', { cache: 'no-store' })).json();
  const order = verses.map((v, i) => [i, v.arabic.length + v.english.length]).sort((a, b) => a[1] - b[1]);
  const quick = { short: order[0][0], mid: order[Math.floor(order.length / 2)][0], long: order[order.length - 1][0] };
  $('verseSel').innerHTML = verses.map((v, i) => `<option value="${i}">${esc(v.ref)}</option>`).join('');
  state.verse = quick.mid; $('verseSel').value = String(state.verse);
  $('prayerSel').innerHTML = PRAYERS.map((p, i) => `<option value="${i}">Next: ${p.name} (${pad(p.h)}:${pad(p.m)})</option>`).join('');
  $('prayerSel').value = String(state.prayer);
  $('homeApps').innerHTML = '<i></i>'.repeat(20);
  const t0 = new Date(); t0.setHours(PRAYERS[state.prayer].h, PRAYERS[state.prayer].m, 0, 0);
  state.target = t0; state.simNow = new Date(t0.getTime() - 102 * 60000 - 10000);

  seg('designSeg', 'd', (d) => { state.design = d; render(); });
  seg('viewSeg', 'v', (v) => { clearTimeout(pressTimer); setView(v); });
  seg('speedSeg', 's', (s) => { state.speed = Number(s); });
  seg('sizeSeg', 'size', (s) => { state.size = s.split('x').map(Number); applySize(); });
  document.querySelectorAll('[data-q]').forEach((b) => b.onclick = () => {
    if (b.dataset.q === 'none') state.verseNone = true;
    else { state.verseNone = false; state.verse = quick[b.dataset.q]; $('verseSel').value = String(state.verse); }
    render();
  });
  $('verseSel').onchange = (e) => { state.verseNone = false; state.verse = Number(e.target.value); render(); };
  $('prayerSel').onchange = (e) => {
    const mins = Number($('minsRange').value); state.prayer = Number(e.target.value);
    state.target = occurrenceAfter(state.prayer, state.simNow); setMinutes(mins);
  };
  $('fmtSel').onchange = (e) => { state.fmt = e.target.value; render(); };
  $('aLight').onclick = () => { if (state.view === 'compact' || state.view === 'minimal') setView('expanded'); iaLight(); };
  $('mandalaToggle').onchange = (e) => { state.mandala = e.target.checked; render(); };
  $('minsRange').oninput = (e) => setMinutes(Number(e.target.value));
  $('aPress').onclick = touchAndHold; $('island').onclick = touchAndHold;
  $('aArrive').onclick = () => setMinutes(0.05);
  $('aStart').onclick = serverStart; $('aVerse').onclick = newMoodVerse;
  $('reduceMotion').onchange = (e) => { state.reduce = e.target.checked; document.body.classList.toggle('reduce', state.reduce); };
  $('aod').onchange = (e) => $('screen').classList.toggle('aod', e.target.checked);
  $('lightWall').onchange = (e) => $('wallpaper').classList.toggle('light', e.target.checked);
  $('oldCompact').onchange = render;
  $('showBudget').onchange = (e) => { $('screen').classList.toggle('show-budget', e.target.checked); $('gallery').classList.toggle('show-budget', e.target.checked); };
  $('galleryToggle').onchange = (e) => { state.gallery = e.target.checked; $('gallery').classList.toggle('on', state.gallery); render(); };
  window.onresize = fitScale;

  await document.fonts.load('16px AmiriQuranCard');
  applySize(); applyView();
  requestAnimationFrame(loop);
}
init();
</script>
</body>
</html>
