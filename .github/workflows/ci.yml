name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # Manual trigger from the Actions tab or `gh workflow run ci.yml`. Runs on
  # the selected branch; on `main` this also exercises the push-only
  # EAS preview job, so it doubles as a way to re-verify after changing secrets.
  workflow_dispatch:

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Create a minimal .env for the Babel dotenv plugin.
      # Real secrets are NOT needed for lint/test — stub values prevent
      # the allowUndefined: false rule from failing the build transform.
      - name: Create stub .env
        run: |
          echo "SUPABASE_URL=https://stub.supabase.co" >> .env
          echo "SUPABASE_ANON_KEY=stub-anon-key" >> .env
          echo "POSTHOG_API_KEY=" >> .env

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test -- --passWithNoTests

  eas-build-preview:
    name: EAS Preview Build (Android APK)
    runs-on: ubuntu-latest
    # Runs on pushes and manual dispatches — skipped on PRs to save build
    # minutes.
    if: github.event_name != 'pull_request'
    needs: lint-and-test
    # Fire-and-forget convenience build (`--no-wait`) — kicks an EAS build and
    # returns immediately. It is NON-BLOCKING: it must never fail the workflow
    # run or mark a commit red. If it breaks (expired token, EAS outage), that
    # is not a reason to block merges or a release.
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Cleanly skip (green) when the EXPO_TOKEN repo secret is not configured,
      # instead of erroring in "Setup EAS".
      - name: Check for EXPO_TOKEN
        id: eas_token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -n "$EXPO_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=EAS preview skipped::EXPO_TOKEN repo secret is not set. Add it (Settings → Secrets and variables → Actions) to enable the preview build."
          fi

      - name: Install EAS CLI
        if: steps.eas_token.outputs.present == 'true'
        run: npm install -g eas-cli

      - name: Setup EAS
        if: steps.eas_token.outputs.present == 'true'
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: EAS Build (preview — non-blocking)
        if: steps.eas_token.outputs.present == 'true'
        run: eas build --platform android --profile preview --non-interactive --no-wait
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
