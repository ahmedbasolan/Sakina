name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Create a minimal .env for the Babel dotenv plugin.
      # Real secrets are NOT needed for lint/test — stub values prevent
      # the allowUndefined: false rule from failing the build transform.
      - name: Create stub .env
        run: |
          echo "SUPABASE_URL=https://stub.supabase.co" >> .env
          echo "SUPABASE_ANON_KEY=stub-anon-key" >> .env
          echo "POSTHOG_API_KEY=" >> .env

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test -- --passWithNoTests

  eas-build-preview:
    name: EAS Preview Build (Android APK)
    runs-on: ubuntu-latest
    # Only run on pushes to main/develop — skip on PRs to save build minutes
    if: github.event_name == 'push'
    needs: lint-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: EAS Build (preview — non-blocking)
        run: eas build --platform android --profile preview --non-interactive --no-wait
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
