<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minimalist Component Template</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Source+Sans+Pro:wght@400;600&display=swap"
    />
    <style>
      :root {
        --primary-color: #1a1a1a;
        --secondary-color: #f5f5f5;
        --accent-color: #0066cc;
        --font-display: 'Playfair Display', serif;
        --font-body: 'Source Sans Pro', sans-serif;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: var(--font-body);
        color: var(--primary-color);
        background: linear-gradient(135deg, #ffffff 0%, #f8f9fa 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 4rem 2rem;
        text-align: center;
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(10px);
        border-radius: 20px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
      }

      .title {
        font-family: var(--font-display);
        font-size: clamp(2.5rem, 5vw, 4rem);
        font-weight: 400;
        margin-bottom: 1.5rem;
        line-height: 1.2;
        color: var(--primary-color);
        opacity: 0;
        animation: fadeInUp 1s ease-out 0.2s forwards;
      }

      .description {
        font-size: 1.2rem;
        line-height: 1.8;
        color: var(--secondary-color);
        max-width: 600px;
        margin: 0 auto 2rem;
        opacity: 0;
        animation: fadeInUp 1s ease-out 0.4s forwards;
      }

      .cta-button {
        display: inline-block;
        padding: 1rem 2.5rem;
        background: var(--accent-color);
        color: white;
        text-decoration: none;
        border-radius: 50px;
        font-weight: 600;
        transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        opacity: 0;
        animation: fadeInUp 1s ease-out 0.6s forwards;
      }

      .cta-button:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 25px rgba(0, 102, 204, 0.3);
      }

      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (max-width: 768px) {
        .container {
          padding: 2rem 1.5rem;
          margin: 1rem;
        }

        .title {
          font-size: 2rem;
        }

        .description {
          font-size: 1.1rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1 class="title">Distinctive Minimal Component</h1>
      <p class="description">
        Clean, elegant interface with thoughtful typography and subtle animations. Perfect for
        premium brands and sophisticated applications.
      </p>
      <a href="#" class="cta-button">Get Started</a>
    </div>
  </body>
</html>
